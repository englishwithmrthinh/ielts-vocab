# Kiểm tra tự động mỗi lần đẩy code hoặc mở pull request:
# kiểu dữ liệu (typecheck), test thuật toán, build giao diện.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
