[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # sharp có file nhị phân, không gói bằng esbuild được (pipeline cắt ảnh của Claude 3)
  external_node_modules = ["sharp"]
  # Prompt vẽ ảnh được đọc lúc chạy
  included_files = ["prompts/**"]

# API: mỗi function tự khai báo đường dẫn /api/... trong `export const config = { path }`.
# Mọi đường dẫn khác trả về app React (SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "vite"
  targetPort = 5173
